services:
  mongodb:
    image: mongo:7.0
    container_name: codebase_universe_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: codebase_universe_backend
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8008
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=codebase_universe
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - backend_storage:/app/backend/storage

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: codebase_universe_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_storage:
